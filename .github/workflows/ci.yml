
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts and Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          docker run --rm \
            -v "$PWD:/mnt" \
            -w /mnt \
            koalaman/shellcheck:v0.11.0 \
            scripts/sysinfo.sh scripts/healthcheck.sh

      - name: Run Hadolint
        run: |
          docker run --rm -i \
            hadolint/hadolint:v2.12.0 \
            < app/Dockerfile

  build-and-test:
    name: Build and test NGINX
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "BUILD_SHA=${GITHUB_SHA}" \
            -f app/Dockerfile \
            -t "devops-intern-final:${GITHUB_SHA}" \
            .

      - name: Start container
        run: |
          docker run -d \
            --name devops-intern-final \
            -p 8080:8080 \
            "devops-intern-final:${GITHUB_SHA}"

      - name: Test application
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..20}; do
            if curl --fail --silent \
              http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "ERROR: NGINX did not become healthy."
              docker logs devops-intern-final
              exit 1
            fi

            sleep 2
          done

          scripts/healthcheck.sh \
            http://127.0.0.1:8080/healthz

          page="$(curl --fail --silent http://127.0.0.1:8080/)"

          grep -Fq "${GITHUB_SHA}" <<< "$page"

          image_size="$(docker image inspect \
            --format='{{.Size}}' \
            "devops-intern-final:${GITHUB_SHA}")"

          if [ "$image_size" -ge 62914560 ]; then
            echo "ERROR: Image must be smaller than 60 MB."
            exit 1
          fi

          echo "Application tests passed."
          echo "Image size: ${image_size} bytes"

  publish:
    name: Publish image to GHCR
    needs:
      - lint
      - build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
